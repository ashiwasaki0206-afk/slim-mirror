<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="スリムミラー">
<title>スリムミラー</title>
<style>
  :root{
    --bg:#0e1013; --panel:rgba(16,19,23,.86); --line:rgba(255,255,255,.14);
    --fg:#eef1f4; --muted:#9aa3ad; --accent:#5fd3b0; --warn:#f2b45a;
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);overflow:hidden;
    font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif;-webkit-user-select:none;user-select:none}
  #cv{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 35%;display:block;touch-action:none}
  #cv.contain{object-fit:contain;object-position:50% 0}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  #start h1{margin:0;font-size:28px;letter-spacing:.04em}
  #start p{margin:0;color:var(--muted);line-height:1.7;max-width:34em}
  button{font:inherit;color:var(--fg);background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;white-space:nowrap}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);color:#06261d;border-color:var(--accent);font-weight:700;padding:14px 28px;font-size:17px}
  button.on{border-color:var(--accent);color:var(--accent)}
  #bar{position:fixed;left:50%;bottom:calc(8px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(720px,calc(100% - 16px));
    background:var(--panel);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);border-radius:16px;
    padding:8px 10px;display:flex;flex-direction:column;gap:7px}
  #bar.min .full{display:none!important}
  .row{display:flex;gap:6px;align-items:center;min-width:0}
  .scroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .scroll::-webkit-scrollbar{display:none}
  .lbl{color:var(--muted);font-size:12px;flex:0 0 3.3em}
  .pill{padding:6px 10px;border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums;flex:0 0 auto}
  .pill.on{background:var(--accent);color:#06261d;border-color:var(--accent);font-weight:700}
  input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
  .val{font-variant-numeric:tabular-nums;min-width:3.6em;text-align:right;font-weight:700}
  .btns .sp{flex:1}
  #chip{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);max-width:calc(100% - 20px)}
  #chip.ok{color:var(--accent)} #chip.warn{color:var(--warn)}
  #labels{position:fixed;top:calc(48px + env(safe-area-inset-top,0px));left:10px;right:10px;justify-content:space-between;display:flex;gap:6px;font-size:12px}
  #labels span{padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line)}
  #err{color:var(--warn)}
  #toast{position:fixed;left:50%;top:40%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="start">
  <h1>スリムミラー</h1>
  <p>カメラに映った顔を、リアルタイムで痩せた姿にして見せます。<br>映像はこの端末の中だけで処理され、どこにも送信されません。</p>
  <button class="primary" id="go">カメラをオンにする</button>
  <p id="err"></p>
</div>

<div id="chip" hidden></div>
<div id="labels" hidden><span>元の顔</span><span>痩せた顔</span></div>
<div id="toast" hidden></div>

<div id="bar" hidden>
  <div class="row scroll full" id="kgRow"><span class="lbl">体重</span></div>
  <div class="row full">
    <span class="lbl">微調整</span>
    <input id="amt" type="range" min="0" max="30" step="1" value="15" aria-label="体重の微調整">
    <span class="val" id="amtv"></span>
  </div>
  <div class="row scroll full" id="tanRow"><span class="lbl">日焼け</span></div>
  <div class="row btns">
    <button id="hold" title="押している間だけ元の顔">元の顔</button>
    <button id="cmp">比較</button>
    <button id="snap">保存</button>
    <button id="more" class="full">…</button>
    <span class="sp"></span>
    <button id="fold" aria-label="パネルをたたむ">▼</button>
  </div>
  <div class="row scroll" id="moreRow" hidden>
    <button id="skinBtn" class="on">肌なめらか</button>
    <button id="mirror" class="on">鏡表示</button>
    <button id="flip">カメラ切替</button>
  </div>
</div>

<script type="module">
const $ = s => document.querySelector(s);
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Mac/.test(navigator.platform));
const cv = $('#cv');
const gl = cv.getContext('webgl', {preserveDrawingBuffer:true, antialias:false});
const video = document.createElement('video');
video.playsInline = true; video.muted = true; video.setAttribute('playsinline',''); video.setAttribute('muted','');

const load = (k,d)=>{ try{ const v=localStorage.getItem('slim.'+k); return v===null?d:JSON.parse(v) }catch(e){ return d } };
const save = (k,v)=>{ try{ localStorage.setItem('slim.'+k, JSON.stringify(v)) }catch(e){} };

const N = 24;                        // 輪郭を動かす点の数
const pts = new Float32Array(N*4);   // x, y, vx, vy（横は縦横比で補正した座標）
const S = {kg:load('kg',15), tan:load('tan',0), skin:load('skin',true), mirror:true, hold:false, split:0,
  face:false, facing:'user', lastSeen:0, skinC:[0.45,0.58],
  g:{cx:0.5,cy:0.5,fw:0.3,rad:0.1,roll:0,eyeD:-0.1,chinD:0.2,e:[0,0,0,0],erad:0.03}};

// ---------- WebGL ----------
const vs = `attribute vec2 p; varying vec2 uv;
void main(){ uv = p*0.5+0.5; uv.y = 1.0-uv.y; gl_Position = vec4(p,0.,1.); }`;
const fs = `precision highp float; varying vec2 uv;
uniform sampler2D tex, mtex; uniform vec2 mpx, px; uniform vec4 P[${N}];
uniform float asp, rad, mirror, split, hold, tan, face, fw, roll, eyeD, chinD, ks, smooth;
uniform vec2 C, skin; uniform vec4 E; uniform float erad, estr;
vec2 cbcr(vec3 c){ return vec2(0.5 + (-0.168736*c.r - 0.331264*c.g + 0.5*c.b), 0.5 + (0.5*c.r - 0.418688*c.g - 0.081312*c.b)); }
void main(){
  vec2 s = vec2(mirror>0.5 ? 1.0-uv.x : uv.x, uv.y);
  bool before = hold>0.5 || uv.x < split;
  if(!before && face>0.5){
    vec2 q = vec2(s.x*asp, s.y);
    // 顔の傾きに合わせた座標で、頬〜あごを横に細く（目鼻口の幅は変えない）
    float cr = cos(roll), sr = sin(roll);
    vec2 r = q - C; r = vec2(cr*r.x + sr*r.y, -sr*r.x + cr*r.y);
    float vb = (0.35 + 0.65*smoothstep(eyeD-0.25*fw, chinD-0.05*fw, r.y))
             * smoothstep(eyeD-1.2*fw, eyeD-0.55*fw, r.y)
             * (1.0 - 0.6*smoothstep(chinD+0.35*fw, chinD+1.0*fw, r.y));   // あご下〜首も一緒に細く（段差を作らない）
    float tt = clamp(abs(r.x)/(fw*1.15), 0.0, 1.0);
    float bump = sin(3.14159*tt); bump *= bump;
    r.x += sign(r.x) * ks * fw * 0.45 * vb * bump;
    q = C + vec2(cr*r.x - sr*r.y, sr*r.x + cr*r.y);
    // フェイスライン・あご下を局所的に引き締め
    vec2 off = vec2(0.0); float ws = 0.0;
    for(int i=0;i<${N};i++){
      vec2 d = q - P[i].xy;
      float w = max(0.0, 1.0 - dot(d,d)/(rad*rad)); w *= w;
      off += w*P[i].zw; ws += w;
    }
    q += off / max(1.0, ws);
    // むくみが取れて目が少し大きく見える
    for(int j=0;j<2;j++){
      vec2 ec = j==0 ? E.xy : E.zw;
      vec2 d = q - ec; float w = max(0.0, 1.0 - dot(d,d)/(erad*erad)); w*=w;
      q -= d * w * estr;
    }
    s = vec2(q.x/asp, q.y);
  }
  s = clamp(s, 0.0, 1.0);
  vec3 c = texture2D(tex, s).rgb;
  if(!before && face>0.5 && (tan>0.001 || smooth>0.001)){
    float mk = 0.0;   // 顔と首の形のマスク（ぼかして境目を消す）
    for(int a=-2;a<=2;a++) for(int b=-2;b<=2;b++) mk += texture2D(mtex, s + vec2(float(a),float(b))*mpx).r;
    mk /= 25.0;
    float dist = length((cbcr(c) - skin)*vec2(1.0,1.3));
    float m = mk * (1.0 - smoothstep(0.06, 0.14, dist));   // 髪・ひげ・服は除く
    if(smooth>0.001 && m>0.01){
      // 肌なめらか：色が近い周りの画素だけで平均（輪郭や目はぼかさない）
      vec3 acc = c; float wsum = 1.0;
      for(int a=0;a<8;a++){
        float ang = float(a)*0.785398;
        vec2 o = vec2(cos(ang), sin(ang)) * px * 3.0;
        vec3 n = texture2D(tex, s+o).rgb; float w = exp(-dot(n-c,n-c)*180.0);
        acc += n*w; wsum += w;
        n = texture2D(tex, s+o*2.0).rgb; w = exp(-dot(n-c,n-c)*180.0)*0.7;
        acc += n*w; wsum += w;
      }
      c = mix(c, acc/wsum, m*smooth);
    }
    if(tan>0.001){
      vec3 t = c * vec3(0.84, 0.75, 0.66);
      t = mix(t, t*t*1.25, 0.25);
      c = mix(c, t, m*tan);
    }
  }
  if(split>0.001 && abs(uv.x-split)<0.002) c = vec3(1.0);
  gl_FragColor = vec4(c,1.0);
}`;
function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER,vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
function mkTex(unit){ const t=gl.createTexture(); gl.activeTexture(gl.TEXTURE0+unit); gl.bindTexture(gl.TEXTURE_2D,t);
  for(const [a,b] of [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]]) gl.texParameteri(gl.TEXTURE_2D,a,b);
  return t; }
mkTex(1); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
mkTex(0);
const U = n => gl.getUniformLocation(prog,n);
const u = Object.fromEntries(['tex','mtex','mpx','px','P','asp','rad','mirror','split','hold','tan','face','fw','roll','eyeD','chinD','ks','smooth','C','skin','E','erad','estr'].map(n=>[n,U(n)]));
gl.uniform1i(u.tex,0); gl.uniform1i(u.mtex,1);
const mcv = document.createElement('canvas'); mcv.width=96; mcv.height=128; const mctx = mcv.getContext('2d');
let maskDirty = false;

// ---------- 顔の検出（MediaPipe Face Landmarker） ----------
const CONTOUR = [[234,.3],[93,.5],[132,.75],[58,.9],[172,1],[136,1],[150,.9],[176,.7],[152,.5],
                 [400,.7],[379,.9],[365,1],[397,1],[288,.9],[361,.75],[323,.5],[454,.3]];
const OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
let faceLm = null;
async function loadFace(){
  setChip('顔の検出を準備中…（初回は数秒かかります）');
  try{
    const v = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const files = await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    faceLm = await v.FaceLandmarker.createFromOptions(files,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: isMobile ? 'CPU' : 'GPU'},
      runningMode:'VIDEO', numFaces:1, minFaceDetectionConfidence:0.4, minTrackingConfidence:0.4});
    setChip('顔を画面に入れてください');
  }catch(e){ console.warn(e); setChip('顔の検出を読み込めませんでした。ネット接続を確認して開き直してください','warn'); }
}
function setChip(t,cls){const c=$('#chip');c.hidden=false;c.textContent=t;c.className=cls||''}
function toast(t){ const el=$('#toast'); el.textContent=t; el.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>el.hidden=true,1800); }

const sampler = document.createElement('canvas'); const sctx = sampler.getContext('2d',{willReadFrequently:true});
let lastTs=-1, lastSkin=0, raw=null;
const EVERY = isMobile ? 70 : 33;
function track(now){
  if(!faceLm || video.readyState<2) return;
  const ts=Math.round(now); if(ts-lastTs<EVERY) return; lastTs=ts;
  let r; try{ r = faceLm.detectForVideo(video, ts) }catch(e){ return }
  const L = r && r.faceLandmarks && r.faceLandmarks[0];
  if(!L){ if(S.face && now-S.lastSeen>700){ S.face=false; raw=null; setChip('顔を画面に入れてください'); } return; }
  applyLm(L, now);
}
function applyLm(L, now){
  if(!video.videoWidth) return;
  const asp = video.videoWidth/video.videoHeight;
  const Q = i => [L[i].x*asp, L[i].y];
  const a=Q(234), b=Q(454), nose=Q(1), chin=Q(152), top=Q(10);
  const fw = Math.hypot(a[0]-b[0], a[1]-b[1]);
  const eyeL=[(Q(159)[0]+Q(145)[0])/2,(Q(159)[1]+Q(145)[1])/2], eyeR=[(Q(386)[0]+Q(374)[0])/2,(Q(386)[1]+Q(374)[1])/2];
  let roll = Math.atan2(eyeR[1]-eyeL[1], eyeR[0]-eyeL[0]); if(Math.abs(roll)>Math.PI/2) roll += roll>0?-Math.PI:Math.PI;
  const C=[(top[0]+chin[0])/2, (top[1]+chin[1])/2];
  const cr=Math.cos(roll), sr=Math.sin(roll);
  const along = p => -sr*(p[0]-C[0]) + cr*(p[1]-C[1]);      // 顔の縦方向の位置
  const amt = (S.kg/30) * 0.10 * fw;
  const t = new Float32Array(N*4);
  const ctr = [nose[0], nose[1]];
  CONTOUR.forEach(([i,w],k)=>{
    const p=Q(i); let nx=p[0]-ctr[0], ny=p[1]-ctr[1]; const n=Math.hypot(nx,ny)||1; nx/=n; ny/=n;
    t[k*4]=p[0]; t[k*4+1]=p[1]; t[k*4+2]=nx*amt*w; t[k*4+3]=ny*amt*w;
  });
  // 二重あご：あご下のふくらみの下端を引き上げる（顔の向きに合わせる）
  const down=[-sr, cr], side=[cr, sr];
  [[0,0.15,1.3],[-0.17,0.11,1.0],[0.17,0.11,1.0]].forEach(([ox,oy,w],j)=>{
    const k=17+j;
    t[k*4]  = chin[0]+side[0]*ox*fw+down[0]*oy*fw; t[k*4+1]= chin[1]+side[1]*ox*fw+down[1]*oy*fw;
    t[k*4+2]= (side[0]*ox*0.8+down[0]*w)*amt;      t[k*4+3]= (side[1]*ox*0.8+down[1]*w)*amt;
  });
  // あご下のたるみ：フェイスラインの少し下を、内側＋上へ引き締める
  [172,136,397,365].forEach((i,j)=>{
    const p=Q(i); let ox=p[0]-ctr[0], oy=p[1]-ctr[1]; const n=Math.hypot(ox,oy)||1; ox/=n; oy/=n;
    const k=20+j, px=p[0]+down[0]*0.13*fw, py=p[1]+down[1]*0.13*fw;
    t[k*4]=px; t[k*4+1]=py; t[k*4+2]=(ox*0.9+down[0]*0.6)*amt; t[k*4+3]=(oy*0.9+down[1]*0.6)*amt;
  });
  // 日焼け・肌なめらか用のマスク：顔の輪郭＋首
  { const W=96, H=Math.round(96/asp); if(mcv.height!==H) mcv.height=H;
    mctx.fillStyle='#000'; mctx.fillRect(0,0,W,H); mctx.fillStyle='#fff';
    const X=x=>x/asp*W, Y=y=>y*H;
    mctx.beginPath(); OVAL.forEach((i,k)=>{const p=Q(i); k?mctx.lineTo(X(p[0]),Y(p[1])):mctx.moveTo(X(p[0]),Y(p[1]));}); mctx.closePath(); mctx.fill();
    const j1=Q(172), j2=Q(397), n1=[chin[0]+side[0]*0.3*fw+down[0]*0.9*fw, chin[1]+side[1]*0.3*fw+down[1]*0.9*fw], n2=[chin[0]-side[0]*0.3*fw+down[0]*0.9*fw, chin[1]-side[1]*0.3*fw+down[1]*0.9*fw];
    mctx.beginPath(); mctx.moveTo(X(j1[0]),Y(j1[1])); mctx.lineTo(X(j2[0]),Y(j2[1])); mctx.lineTo(X(n1[0]),Y(n1[1])); mctx.lineTo(X(n2[0]),Y(n2[1])); mctx.closePath(); mctx.fill();
    // 目・口は肌補正しない
    mctx.fillStyle='#000';
    for(const ring of [[33,160,158,133,153,144],[362,385,387,263,373,380],[61,40,0,270,291,321,17,91]]){
      mctx.beginPath(); ring.forEach((i,k)=>{const p=Q(i); k?mctx.lineTo(X(p[0]),Y(p[1])):mctx.moveTo(X(p[0]),Y(p[1]));}); mctx.closePath(); mctx.fill(); }
    maskDirty = true; }
  raw = {t, C, fw, rad:fw*0.34, roll, eyeD:along([(eyeL[0]+eyeR[0])/2,(eyeL[1]+eyeR[1])/2]), chinD:along(chin),
         e:[eyeL[0],eyeL[1],eyeR[0],eyeR[1]], erad:fw*0.13};
  S.lastSeen = now;
  if(!S.face){ S.face=true; setChip('顔を追従中','ok'); }
  if(now-lastSkin>600){     // 肌の色を頬とおでこから測る
    lastSkin=now; const W=160, H=Math.round(160/asp); sampler.width=W; sampler.height=H;
    sctx.drawImage(video,0,0,W,H);
    let cb=0,crr=0,n=0;
    for(const i of [50,280,10,205,425]){
      const x=Math.round(L[i].x*W), y=Math.round(L[i].y*H); if(x<1||y<1||x>=W-1||y>=H-1) continue;
      const d=sctx.getImageData(x-1,y-1,3,3).data;
      for(let j=0;j<d.length;j+=4){ const R=d[j]/255,G=d[j+1]/255,B=d[j+2]/255;
        cb+=0.5+(-0.168736*R-0.331264*G+0.5*B); crr+=0.5+(0.5*R-0.418688*G-0.081312*B); n++; }
    }
    if(n) S.skinC=[cb/n, crr/n];
  }
}

// ---------- 描画 ----------
function lerp(a,b,k){ return a+(b-a)*k }
function render(holdOverride){
  const g=S.g, asp=video.videoWidth/video.videoHeight;
  gl.activeTexture(gl.TEXTURE0);
  gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
  if(maskDirty){ gl.activeTexture(gl.TEXTURE1); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,mcv); gl.activeTexture(gl.TEXTURE0); maskDirty=false; }
  gl.uniform2f(u.mpx, 1.5/mcv.width, 1.5/mcv.height); gl.uniform2f(u.px, 1/video.videoWidth, 1/video.videoHeight);
  gl.uniform4fv(u.P, pts); gl.uniform1f(u.asp, asp);
  gl.uniform1f(u.rad, g.rad); gl.uniform1f(u.face, S.face?1:0); gl.uniform1f(u.fw, g.fw);
  gl.uniform2f(u.C, g.cx, g.cy); gl.uniform1f(u.roll, g.roll); gl.uniform1f(u.eyeD, g.eyeD); gl.uniform1f(u.chinD, g.chinD);
  gl.uniform1f(u.ks, (S.kg/30)*0.20);
  gl.uniform4fv(u.E, g.e); gl.uniform1f(u.erad, g.erad); gl.uniform1f(u.estr, (S.kg/30)*0.12);
  gl.uniform1f(u.mirror,S.mirror?1:0); gl.uniform1f(u.split, holdOverride===undefined?S.split:0); gl.uniform1f(u.hold, holdOverride===undefined?(S.hold?1:0):holdOverride);
  gl.uniform1f(u.tan,S.tan); gl.uniform1f(u.smooth, S.skin ? 0.25+0.35*(S.kg/30) : 0); gl.uniform2fv(u.skin,S.skinC);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
}
function frame(now){
  if(video.readyState>=2 && video.videoWidth){
    if(cv.width!==video.videoWidth || cv.height!==video.videoHeight){ cv.width=video.videoWidth; cv.height=video.videoHeight; gl.viewport(0,0,cv.width,cv.height); fit(); }
    track(now);
    if(raw){   // 動きが大きい時は素早く、止まっている時はなめらかに追従（ブレ防止）
      const g=S.g, mv=Math.hypot(raw.C[0]-g.cx, raw.C[1]-g.cy)/(raw.fw||1);
      const k = Math.min(0.85, 0.25 + mv*6);
      for(let i=0;i<N*4;i++) pts[i] = lerp(pts[i], raw.t[i], k);
      g.cx=lerp(g.cx,raw.C[0],k); g.cy=lerp(g.cy,raw.C[1],k); g.fw=lerp(g.fw,raw.fw,k); g.rad=lerp(g.rad,raw.rad,k);
      g.roll=lerp(g.roll,raw.roll,k); g.eyeD=lerp(g.eyeD,raw.eyeD,k); g.chinD=lerp(g.chinD,raw.chinD,k); g.erad=lerp(g.erad,raw.erad,k);
      for(let i=0;i<4;i++) g.e[i]=lerp(g.e[i],raw.e[i],k);
    }
    render();
  }
  requestAnimationFrame(frame);
}

// ---------- UI ----------
function setAmt(v){
  if(v!==undefined) $('#amt').value=v;
  S.kg = +$('#amt').value; save('kg',S.kg);
  $('#amtv').textContent = S.kg ? `−${S.kg}kg` : 'そのまま';
  document.querySelectorAll('#kgRow .pill').forEach(b=>b.classList.toggle('on', +b.dataset.kg===S.kg));
}
for(const kg of [0,5,10,15,20,25,30]){
  const b=document.createElement('button'); b.className='pill'; b.dataset.kg=kg; b.textContent = kg?`−${kg}kg`:'今のまま';
  b.addEventListener('click',()=>setAmt(kg)); $('#kgRow').appendChild(b);
}
$('#amt').addEventListener('input',()=>setAmt()); setAmt(S.kg);
const TANS=[['なし',0],['うっすら',0.4],['小麦色',0.7],['こんがり',1]];
for(const [name,v] of TANS){
  const b=document.createElement('button'); b.className='pill'+(v===S.tan?' on':''); b.textContent=name;
  b.addEventListener('click',()=>{ S.tan=v; save('tan',v); document.querySelectorAll('#tanRow .pill').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#tanRow').appendChild(b);
}
const hold=$('#hold');
const on=e=>{e&&e.preventDefault();S.hold=true;hold.classList.add('on')}, off=()=>{S.hold=false;hold.classList.remove('on')};
hold.addEventListener('pointerdown',on); window.addEventListener('pointerup',off); hold.addEventListener('pointercancel',off);
hold.addEventListener('contextmenu',e=>e.preventDefault());
hold.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')on()}); hold.addEventListener('keyup',off);

// 左右比較：線は画面を指でなぞって動かせる
function fit(){   // 画面と映像の形が近ければ全面表示、大きく違えば全体が見えるように
  if(!cv.width) return;
  const ca=cv.width/cv.height, ra=innerWidth/innerHeight;
  cv.classList.toggle('contain', Math.max(ca/ra, ra/ca) > 1.35);
}
addEventListener('resize',fit);
function canvasX(clientX){   // object-fit:cover を考えて画面の位置→映像の位置
  const r=cv.getBoundingClientRect(), ca=cv.width/cv.height, ra=r.width/r.height;
  const cover = !cv.classList.contains('contain');
  const dispW = cover ? (ca>ra ? r.height*ca : r.width) : (ca>ra ? r.width : r.height*ca), left = r.left + (r.width-dispW)/2;
  return Math.min(0.98, Math.max(0.02, (clientX-left)/dispW));
}
$('#cmp').addEventListener('click',e=>{ S.split = S.split?0:0.5; e.target.classList.toggle('on',!!S.split); $('#labels').hidden=!S.split; if(S.split) toast('画面をなぞると線を動かせます'); });
let dragging=false;
cv.addEventListener('pointerdown',e=>{ if(S.split){ dragging=true; S.split=canvasX(e.clientX); } });
cv.addEventListener('pointermove',e=>{ if(dragging) S.split=canvasX(e.clientX); });
window.addEventListener('pointerup',()=>dragging=false);

$('#more').addEventListener('click',e=>{ const m=$('#moreRow'); m.hidden=!m.hidden; e.target.classList.toggle('on',!m.hidden); });
$('#skinBtn').classList.toggle('on',S.skin);
$('#skinBtn').addEventListener('click',e=>{ S.skin=!S.skin; save('skin',S.skin); e.target.classList.toggle('on',S.skin); });
$('#mirror').addEventListener('click',e=>{S.mirror=!S.mirror;e.target.classList.toggle('on',S.mirror)});
$('#fold').addEventListener('click',e=>{ const m=$('#bar').classList.toggle('min'); e.target.textContent=m?'▲':'▼'; if(m) $('#moreRow').hidden=true; });

// 保存：ビフォー・アフターを横並びにした1枚を作る
$('#snap').addEventListener('click',async()=>{
  if(!video.videoWidth) return;
  const W=cv.width, H=cv.height, out=document.createElement('canvas'); out.width=W*2; out.height=H;
  const o=out.getContext('2d');
  render(1); o.drawImage(cv,0,0); render(0); o.drawImage(cv,W,0); render();
  const fs=Math.round(H*0.035); o.font=`700 ${fs}px "Hiragino Sans","Yu Gothic UI",sans-serif`;
  const tag=(txt,x)=>{ const w=o.measureText(txt).width+fs; o.fillStyle='rgba(0,0,0,.55)'; o.fillRect(x+fs*0.6,fs*0.6,w,fs*1.6); o.fillStyle='#fff'; o.fillText(txt,x+fs*1.1,fs*1.85); };
  tag('今',0); tag(S.kg?`−${S.kg}kg`:'そのまま',W);
  const blob = await new Promise(r=>out.toBlob(r,'image/jpeg',0.92));
  const d=new Date(), p=n=>String(n).padStart(2,'0');
  const name=`slim_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.jpg`;
  const file = new File([blob], name, {type:'image/jpeg'});
  if(navigator.canShare && navigator.canShare({files:[file]})){
    try{ await navigator.share({files:[file]}); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.download=name; a.href=URL.createObjectURL(blob); a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000); toast('保存しました');
});

// カメラ
let stream=null, wake=null;
async function startCam(){
  if(stream) stream.getTracks().forEach(t=>t.stop());
  stream = await navigator.mediaDevices.getUserMedia({audio:false, video: isMobile
    ? {width:{ideal:720},height:{ideal:1280},facingMode:S.facing}
    : {width:{ideal:1280},height:{ideal:720},facingMode:S.facing}});
  video.srcObject = stream; await video.play();
  S.mirror = S.facing==='user'; $('#mirror').classList.toggle('on',S.mirror);
}
$('#flip').addEventListener('click',async()=>{
  S.facing = S.facing==='user'?'environment':'user';
  try{ await startCam(); }catch(e){ S.facing = S.facing==='user'?'environment':'user'; toast('カメラを切り替えられませんでした'); }
});
async function keepAwake(){ try{ if('wakeLock' in navigator && document.visibilityState==='visible') wake = await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && stream) keepAwake(); });

$('#go').addEventListener('click',async()=>{
  try{
    await startCam();
    $('#start').hidden=true; $('#bar').hidden=false;
    requestAnimationFrame(frame);
    keepAwake();
    setTimeout(loadFace, 100);
  }catch(e){
    $('#err').textContent = 'カメラを開けませんでした。カメラの許可を確認して、もう一度押してください。（'+e.name+'）';
  }
});
window.__applyLm = applyLm;   // 動作確認用
</script>
