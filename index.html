<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>スリムミラー</title>
<style>
  :root{
    --bg:#0e1013; --panel:rgba(20,23,28,.84); --line:rgba(255,255,255,.14);
    --fg:#eef1f4; --muted:#9aa3ad; --accent:#5fd3b0; --warn:#f2b45a;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",system-ui,sans-serif}
  #stage{position:fixed;inset:0;display:flex;align-items:flex-start;justify-content:center}
  canvas{max-width:100%;max-height:100%;display:block}
  #start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:24px}
  #start h1{margin:0;font-size:28px;letter-spacing:.04em}
  #start p{margin:0;color:var(--muted);line-height:1.7;max-width:34em}
  button{font:inherit;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  button.primary{background:var(--accent);color:#06261d;border-color:var(--accent);font-weight:700;padding:14px 28px;font-size:17px}
  button.on{border-color:var(--accent);color:var(--accent)}
  #bar{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);width:min(760px,calc(100% - 16px));
    background:var(--panel);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:14px;
    padding:8px 10px;display:flex;flex-wrap:wrap;gap:7px 10px;align-items:center}
  #bar.min .full{display:none!important}
  .row{display:flex;flex-wrap:wrap;gap:6px;width:100%;align-items:center}
  .lbl{color:var(--muted);font-size:12px;width:3.4em}
  .pill{padding:5px 9px;border-radius:999px;font-size:13px;font-variant-numeric:tabular-nums}
  .pill.on{background:var(--accent);color:#06261d;border-color:var(--accent);font-weight:700}
  input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
  .val{font-variant-numeric:tabular-nums;min-width:4em;text-align:right;font-weight:700}
  .btns{display:flex;gap:6px;flex-wrap:wrap;width:100%}
  .btns .sp{flex:1}
  #chip{position:fixed;top:10px;left:10px;font-size:12px;padding:6px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
  #chip.ok{color:var(--accent)} #chip.warn{color:var(--warn)}
  #err{color:var(--warn)}
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>

<div id="start">
  <h1>スリムミラー</h1>
  <p>カメラに映った顔の輪郭を、リアルタイムで引き締めて見せます。<br>映像はこの端末の中だけで処理され、どこにも送信されません。</p>
  <button class="primary" id="go">カメラをオンにする</button>
  <p id="err"></p>
</div>

<div id="chip" hidden>顔を探しています…</div>

<div id="bar" hidden>
  <div class="row full" id="kgRow"><span class="lbl">体重</span></div>
  <div class="row full">
    <span class="lbl">微調整</span>
    <input id="amt" type="range" min="0" max="30" step="1" value="10">
    <span class="val" id="amtv"></span>
  </div>
  <div class="row full" id="tanRow"><span class="lbl">日焼け</span></div>
  <div class="row full">
    <span class="lbl">比較線</span>
    <input id="split" type="range" min="0" max="100" value="0">
  </div>
  <div class="btns">
    <button id="hold">押す間 元の顔</button>
    <button id="mirror" class="on">鏡表示</button>
    <button id="snap">撮影</button>
    <span class="sp"></span>
    <button id="fold" aria-label="パネルを小さくする">▼</button>
  </div>
</div>

<script type="module">
const $ = s => document.querySelector(s);
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (navigator.maxTouchPoints>1 && /Mac/.test(navigator.platform));
const cv = $('#cv');
const gl = cv.getContext('webgl', {preserveDrawingBuffer:true});
const video = document.createElement('video');
video.playsInline = true; video.muted = true; video.setAttribute('playsinline',''); video.setAttribute('muted','');

const N = 20;                       // 輪郭を動かす点の数
const pts = new Float32Array(N*4);  // x, y, vx, vy（映像座標・横は縦横比で補正）
const S = {kg:10, tan:0, mirror:true, hold:false, split:0,
  face:false, r:0.1, cx:0.5, fw:0.3, skin:[0.5,0.6], lastSeen:0};

// ---------- WebGL ----------
const vs = `attribute vec2 p; varying vec2 uv;
void main(){ uv = p*0.5+0.5; uv.y = 1.0-uv.y; gl_Position = vec4(p,0.,1.); }`;
const fs = `precision highp float; varying vec2 uv;
uniform sampler2D tex, mtex; uniform vec2 mpx; uniform vec4 P[${N}];
uniform float asp, rad, mirror, split, hold, tan, face, cx, cy, fw;
uniform vec2 skin; uniform vec4 E; uniform float erad, estr, ks, eyeY, chinY;
vec2 cbcr(vec3 c){ return vec2(0.5 + (-0.168736*c.r - 0.331264*c.g + 0.5*c.b), 0.5 + (0.5*c.r - 0.418688*c.g - 0.081312*c.b)); }
void main(){
  vec2 s = vec2(mirror>0.5 ? 1.0-uv.x : uv.x, uv.y);
  bool before = hold>0.5 || uv.x < split;
  if(!before && face>0.5){
    vec2 q = vec2(s.x*asp, s.y), off = vec2(0.0); float ws = 0.0;
    // 頬〜あごの高さだけ、顔全体を横に少し細く
    // 縦方向：おでこは少し、頬〜あごで一番、首にかけて弱く（段差が出ないようになめらかに）
    float vb = (0.35 + 0.65*smoothstep(eyeY-0.25*fw, chinY-0.05*fw, q.y))
             * smoothstep(eyeY-1.2*fw, eyeY-0.55*fw, q.y)
             * (1.0 - 0.7*smoothstep(chinY+0.05*fw, chinY+0.6*fw, q.y));
    float dx = q.x - cx*asp; float tt = clamp(abs(dx)/(fw*1.15), 0.0, 1.0);
    float bump = sin(3.14159*tt); bump *= bump;          // 中心（目鼻口）は動かさず、頬だけ内側へ
    q.x += sign(dx) * ks * fw * 0.45 * vb * bump;
    for(int i=0;i<${N};i++){
      vec2 d = q - P[i].xy;
      float w = max(0.0, 1.0 - dot(d,d)/(rad*rad)); w *= w;
      off += w*P[i].zw; ws += w;
    }
    q += off / max(1.0, ws);   // 重なった点で動きが足し算されすぎないように
    // 目をほんの少し大きく（むくみが取れた感じ）
    for(int j=0;j<2;j++){
      vec2 ec = j==0 ? E.xy : E.zw;
      vec2 d = q - ec; float w = max(0.0, 1.0 - dot(d,d)/(erad*erad)); w*=w;
      q -= d * w * estr;
    }
    s = vec2(q.x/asp, q.y);
  }
  vec3 c = texture2D(tex, clamp(s,0.0,1.0)).rgb;
  if(!before && tan>0.001){
    vec2 k = cbcr(c);
    float y = dot(c, vec3(0.299,0.587,0.114));
    float dist = length((k - skin)*vec2(1.0,1.3));
    // 顔の輪郭と首の形に合わせたマスク（ぼかして境目をなくす）
    float mk = 0.0;
    for(int a=-2;a<=2;a++) for(int b=-2;b<=2;b++) mk += texture2D(mtex, s + vec2(float(a),float(b))*mpx).r;
    mk /= 25.0;
    float m = face>0.5 ? mk : 0.0;
    m *= 1.0 - smoothstep(0.06, 0.14, dist);       // 服や髪には乗せない
    // 日焼け：明るさを落として、黄み〜赤みを少し足す（オレンジにしない）
    float L = dot(c, vec3(0.299,0.587,0.114));
    vec3 t = c * vec3(0.84, 0.75, 0.66);
    t = mix(t, t*t*1.25, 0.25);                     // 影を少し深く

    c = mix(c, t, m*tan);
  }
  if(split>0.001 && abs(uv.x-split)<0.0016) c = vec3(1.0);
  gl_FragColor = vec4(c,1.0);
}`;
function sh(t,src){const s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));return s}
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER,vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER,fs));
gl.linkProgram(prog); gl.useProgram(prog);
gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog,'p'); gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
for(const [a,b] of [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]]) gl.texParameteri(gl.TEXTURE_2D,a,b);
const mtex = gl.createTexture(); gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, mtex);
for(const [a,b] of [[gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE],[gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE],[gl.TEXTURE_MIN_FILTER,gl.LINEAR],[gl.TEXTURE_MAG_FILTER,gl.LINEAR]]) gl.texParameteri(gl.TEXTURE_2D,a,b);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
gl.activeTexture(gl.TEXTURE0);
const mcv = document.createElement('canvas'); mcv.width=96; mcv.height=128; const mctx = mcv.getContext('2d');
let maskDirty = false;
const U = n => gl.getUniformLocation(prog,n);
const u = Object.fromEntries(['mtex','mpx','P','asp','rad','mirror','split','hold','tan','face','cx','cy','fw','skin','E','erad','estr','ks','eyeY','chinY'].map(n=>[n,U(n)]));

// ---------- 顔の輪郭（MediaPipe Face Landmarker） ----------
// 頬〜フェイスライン〜あご先の点と、それぞれの引き締め強さ
const CONTOUR = [[234,.3],[93,.5],[132,.75],[58,.9],[172,1],[136,1],[150,.9],[176,.7],[152,.5],
                 [400,.7],[379,.9],[365,1],[397,1],[288,.9],[361,.75],[323,.5],[454,.3]];
const OVAL=[10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
let faceLm = null;
async function loadFace(){
  try{
    const v = await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs');
    const files = await v.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm');
    faceLm = await v.FaceLandmarker.createFromOptions(files,{
      baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task', delegate: isMobile ? 'CPU' : 'GPU'},
      runningMode:'VIDEO', numFaces:1});
    setChip('顔を探しています…');
  }catch(e){ console.warn(e); setChip('顔の検出を読み込めませんでした。ネット接続を確認して開き直してください','warn'); }
}
function setChip(t,cls){const c=$('#chip');c.hidden=false;c.textContent=t;c.className=cls||''}

const sampler = document.createElement('canvas'); const sctx = sampler.getContext('2d',{willReadFrequently:true});
let lastTs=-1, lastSkin=0, target=null, eyes=null;
const EVERY = isMobile ? 90 : 40;
function track(now){
  if(!faceLm || video.readyState<2) return;
  const ts=Math.round(now); if(ts-lastTs<EVERY) return; lastTs=ts;
  let r; try{ r = faceLm.detectForVideo(video, ts) }catch(e){ return }
  const L = r && r.faceLandmarks && r.faceLandmarks[0];
  if(!L){ if(S.face && now-S.lastSeen>800){ S.face=false; target=null; setChip('顔を探しています…'); } return; }
  applyLm(L, now);
}
function applyLm(L, now){
  if(!video.videoWidth) return;
  const asp = video.videoWidth/video.videoHeight;
  const Q = i => [L[i].x*asp, L[i].y];
  const a=Q(234), b=Q(454), nose=Q(1), chin=Q(152);
  const fw = Math.hypot(a[0]-b[0], a[1]-b[1]);
  const c = [nose[0], nose[1] - 0.05*fw];
  const amt = (S.kg/30) * 0.10 * fw;              // −30kgで顔幅の約20%ぶん輪郭を内側へ
  const t = new Float32Array(N*4);
  CONTOUR.forEach(([i,w],k)=>{
    const p=Q(i); let nx=p[0]-c[0], ny=p[1]-c[1]; const n=Math.hypot(nx,ny)||1; nx/=n; ny/=n;
    t[k*4]=p[0]; t[k*4+1]=p[1]; t[k*4+2]=nx*amt*w; t[k*4+3]=ny*amt*w;
  });
  // 二重あご：あごの下のふくらみの下端を上へ引き上げる
  [[0,0.15,1.3],[-0.17,0.11,1.0],[0.17,0.11,1.0]].forEach(([ox,oy,w],j)=>{
    const k=17+j; t[k*4]=chin[0]+ox*fw; t[k*4+1]=chin[1]+oy*fw; t[k*4+2]=ox*amt*0.8; t[k*4+3]=amt*w;
  });
  // 日焼け用マスク：顔の輪郭＋首
  { const W=96, H=Math.round(96/asp); if(mcv.height!==H) mcv.height=H;
    mctx.fillStyle='#000'; mctx.fillRect(0,0,W,H); mctx.fillStyle='#fff';
    const X=x=>x/asp*W, Y=y=>y*H;
    mctx.beginPath(); OVAL.forEach((i,k)=>{const p=Q(i); k?mctx.lineTo(X(p[0]),Y(p[1])):mctx.moveTo(X(p[0]),Y(p[1]));}); mctx.closePath(); mctx.fill();
    const j1=Q(172), j2=Q(397), cxq=nose[0];
    mctx.beginPath(); mctx.moveTo(X(j1[0]),Y(j1[1])); mctx.lineTo(X(j2[0]),Y(j2[1]));
    mctx.lineTo(X(cxq+0.30*fw),Y(chin[1]+0.9*fw)); mctx.lineTo(X(cxq-0.30*fw),Y(chin[1]+0.9*fw)); mctx.closePath(); mctx.fill();
    maskDirty = true; }
  const eyeL=[(Q(159)[0]+Q(145)[0])/2,(Q(159)[1]+Q(145)[1])/2], eyeR=[(Q(386)[0]+Q(374)[0])/2,(Q(386)[1]+Q(374)[1])/2];
  eyes = {e:[eyeL[0],eyeL[1],eyeR[0],eyeR[1]], r: fw*0.13, s:(S.kg/30)*0.12};
  target = {t, eyeY:(Q(159)[1]+Q(386)[1])/2, chinY:chin[1], r: fw*0.34, cx: nose[0]/asp, cy: (Q(10)[1]+chin[1])/2, fw};
  S.lastSeen = now;
  if(!S.face){ S.face=true; setChip('顔を追従中','ok'); }
  // 肌の色を頬とおでこから測る（日焼け用）
  if(now-lastSkin>600){
    lastSkin=now; const W=160, H=Math.round(160/asp); sampler.width=W; sampler.height=H;
    sctx.drawImage(video,0,0,W,H);
    let cb=0,cr=0,n=0;
    for(const i of [50,280,10,205,425]){
      const x=Math.round(L[i].x*W), y=Math.round(L[i].y*H); if(x<1||y<1||x>=W-1||y>=H-1) continue;
      const d=sctx.getImageData(x-1,y-1,3,3).data;
      for(let j=0;j<d.length;j+=4){ const R=d[j]/255,G=d[j+1]/255,B=d[j+2]/255;
        cb+=0.5+(-0.168736*R-0.331264*G+0.5*B); cr+=0.5+(0.5*R-0.418688*G-0.081312*B); n++; }
    }
    if(n) S.skin=[cb/n, cr/n];
  }
}

// ---------- ループ ----------
function frame(now){
  if(video.readyState>=2){
    if(cv.width!==video.videoWidth){ cv.width=video.videoWidth; cv.height=video.videoHeight; gl.viewport(0,0,cv.width,cv.height); }
    track(now);
    if(target){                       // 点の動きをなめらかに
      for(let i=0;i<N*4;i++) pts[i] += (target.t[i]-pts[i])*0.45;
      S.r += (target.r-S.r)*0.45; S.eyeY=target.eyeY; S.chinY=target.chinY; S.cx=target.cx; S.cy=target.cy; S.fw=target.fw;
    }
    if(maskDirty){ gl.activeTexture(gl.TEXTURE1); gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,mcv); gl.activeTexture(gl.TEXTURE0); maskDirty=false; }
    gl.uniform1i(u.mtex,1); gl.uniform2f(u.mpx, 1.5/mcv.width, 1.5/mcv.height);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,video);
    if(eyes){ gl.uniform4fv(u.E, eyes.e); gl.uniform1f(u.erad, eyes.r); gl.uniform1f(u.estr, eyes.s); } else gl.uniform1f(u.estr, 0);
    gl.uniform1f(u.ks, S.face ? (S.kg/30)*0.20 : 0); gl.uniform1f(u.eyeY, S.eyeY||0.4); gl.uniform1f(u.chinY, S.chinY||0.6);
    gl.uniform4fv(u.P, pts); gl.uniform1f(u.asp, video.videoWidth/video.videoHeight);
    gl.uniform1f(u.rad, S.r); gl.uniform1f(u.face, S.face?1:0); gl.uniform1f(u.cx,S.cx); gl.uniform1f(u.cy,S.cy||0.5); gl.uniform1f(u.fw,S.fw);
    gl.uniform1f(u.mirror,S.mirror?1:0); gl.uniform1f(u.split,S.split); gl.uniform1f(u.hold,S.hold?1:0);
    gl.uniform1f(u.tan,S.tan); gl.uniform2fv(u.skin,S.skin);
    gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  }
  requestAnimationFrame(frame);
}

// ---------- UI ----------
function setAmt(){
  S.kg = +$('#amt').value;
  $('#amtv').textContent = S.kg ? `−${S.kg}kg` : 'そのまま';
  document.querySelectorAll('#kgRow .pill').forEach(b=>b.classList.toggle('on', +b.dataset.kg===S.kg));
}
for(const kg of [0,5,10,15,20,25,30]){
  const b=document.createElement('button'); b.className='pill'; b.dataset.kg=kg; b.textContent = kg?`−${kg}kg`:'今のまま';
  b.addEventListener('click',()=>{ $('#amt').value=kg; setAmt(); }); $('#kgRow').appendChild(b);
}
$('#amt').addEventListener('input',setAmt); setAmt();
for(const [name,v] of [['なし',0],['うっすら',0.4],['小麦色',0.7],['こんがり',1]]){
  const b=document.createElement('button'); b.className='pill'+(v===0?' on':''); b.textContent=name;
  b.addEventListener('click',()=>{ S.tan=v; document.querySelectorAll('#tanRow .pill').forEach(x=>x.classList.toggle('on',x===b)); });
  $('#tanRow').appendChild(b);
}
$('#split').addEventListener('input',e=>{ S.split = +e.target.value/100; });
const hold=$('#hold');
const on=e=>{e&&e.preventDefault();S.hold=true;hold.classList.add('on')}, off=()=>{S.hold=false;hold.classList.remove('on')};
hold.addEventListener('pointerdown',on); window.addEventListener('pointerup',off); hold.addEventListener('pointercancel',off);
hold.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter')on()}); hold.addEventListener('keyup',off);
$('#mirror').addEventListener('click',e=>{S.mirror=!S.mirror;e.target.classList.toggle('on',S.mirror)});
$('#fold').addEventListener('click',e=>{ const m=$('#bar').classList.toggle('min'); e.target.textContent=m?'▲':'▼'; });
$('#snap').addEventListener('click',()=>{
  const a=document.createElement('a'); const d=new Date(), p=n=>String(n).padStart(2,'0');
  a.download=`slim_${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}.png`;
  a.href=cv.toDataURL('image/png'); a.click();
});

$('#go').addEventListener('click',async()=>{
  try{
    const s = await navigator.mediaDevices.getUserMedia({audio:false, video: isMobile
      ? {width:{ideal:720},height:{ideal:960},facingMode:'user'}
      : {width:{ideal:1280},height:{ideal:720},facingMode:'user'}});
    video.srcObject = s; await video.play();
    $('#start').hidden=true; $('#bar').hidden=false;
    setChip('顔の検出を準備中…');
    requestAnimationFrame(frame);
    setTimeout(loadFace, 200);
  }catch(e){
    $('#err').textContent = 'カメラを開けませんでした。カメラの許可を確認して、もう一度押してください。（'+e.name+'）';
  }
});
</script>
</body>
</html>
